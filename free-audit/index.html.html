<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Digital Marketing Audit | SmartBizSystems</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="canonical" href="https://www.smartbizsystems.co.ke/free-audit/" />
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: { dark: '#0B0F19', neon: '#2DD4BF', purple: '#A78BFA' }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #0B0F19; color: #F3F4F6; }
        .text-gradient { background: linear-gradient(to right, #2DD4BF, #A78BFA); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 50; }
        .modal-active { display: flex !important; }
    </style>
</head>
<body class="antialiased">

    

    <header class="relative pt-12 pb-32 text-center">
        <div class="max-w-3xl mx-auto px-6">
            <div class="inline-flex items-center px-4 py-1 rounded-full border border-brand-neon/30 bg-brand-neon/5 mb-6">
                <span class="text-xs font-bold text-brand-neon uppercase tracking-widest">5 Slots Left This Week</span>
            </div>
            
            <h1 class="text-5xl lg:text-7xl font-extrabold text-white mb-8 leading-tight">
                Stop Guessing. <br>Start <span class="text-gradient">Scaling.</span>
            </h1>

            <p class="text-xl text-slate-300 mb-10 leading-relaxed">
                Get a <strong>manual review</strong> of your website and sales funnel. I'll show you exactly where you're losing customers and how to fix it.
            </p>

            <button onclick="toggleModal()" class="px-10 py-5 bg-brand-neon text-brand-dark font-black text-lg uppercase tracking-tighter rounded-xl hover:scale-105 transition-all shadow-[0_0_30px_rgba(45,212,191,0.3)]">
                Claim My Free Audit →
            </button>

            <div class="mt-8 flex justify-center space-x-6 text-sm text-gray-500 font-medium">
                <span><i class="fa-solid fa-bolt text-brand-neon mr-2"></i> 24h Turnaround</span>
                <span><i class="fa-solid fa-circle-check text-brand-neon mr-2"></i> 100% Free</span>
            </div>
        </div>
    </header>

    <div id="auditModal" class="modal-overlay items-center justify-center p-4">
        <div class="bg-gray-900 w-full max-w-lg rounded-2xl border border-gray-800 shadow-2xl relative overflow-hidden">
            <button onclick="toggleModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl">&times;</button>
            
            <div class="p-8">
                <h3 class="text-2xl font-bold text-white mb-2">Almost there!</h3>
                <p class="text-gray-400 text-sm mb-6">Enter your details and I'll start your audit personally.</p>

                <form action="https://cal.com/joseph-mulei-1cdivg/free-growth-audit" method="get" class="space-y-4">
                    <input type="text" name="name" required placeholder="Full Name" class="w-full bg-brand-dark border border-gray-700 rounded-lg p-3 text-white focus:border-brand-neon outline-none">
                    <input type="email" name="email" required placeholder="Email Address" class="w-full bg-brand-dark border border-gray-700 rounded-lg p-3 text-white focus:border-brand-neon outline-none">
                    <input type="text" name="business-name" required placeholder="Business Name" class="w-full bg-brand-dark border border-gray-700 rounded-lg p-3 text-white focus:border-brand-neon outline-none">
                    <input type="text" name="Website-URL" placeholder="Website (e.g. www.mysite.com)" class="w-full bg-brand-dark border border-gray-700 rounded-lg p-3 text-white focus:border-brand-neon outline-none">
                    <input type="tel" name="attendeePhoneNumber" required placeholder="WhatsApp Number" class="w-full bg-brand-dark border border-gray-700 rounded-lg p-3 text-white focus:border-brand-neon outline-none">
                    
                    <button type="submit" class="w-full py-4 bg-brand-neon text-brand-dark font-bold uppercase rounded-lg hover:bg-brand-neonhover transition-all">
                        SEND MY AUDIT REQUEST
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function toggleModal() {
            const modal = document.getElementById('auditModal');
            modal.classList.toggle('modal-active');
        }

        // Close modal if user clicks outside of the box
        window.onclick = function(event) {
            const modal = document.getElementById('auditModal');
            if (event.target == modal) {
                toggleModal();
            }
        }
    </script>


<script src="/components/nav.js"></script>
</body>
</html>
