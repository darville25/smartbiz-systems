    <!-- LOGIC SCRIPT (Updated Payment Methods)       -->
    <!-- ============================================ -->
    <script>
        // --- CONFIGURATION ---
        const DEV_MODE = true; // Set to FALSE for Production
        const PAYSTACK_PUBLIC_KEY = 'pk_test_YOUR_PAYSTACK_KEY'; // PASTE KEY HERE

        let currentMode = "M-Pesa Auditor";
        let activeTone = "Friendly";
        let globalData = [];
        let clerkInstance = null;
        let currentUser = null;

        // 1. INIT & AUTH
        window.addEventListener("DOMContentLoaded", async function () {
            setTimeout(() => {
                const loader = document.getElementById('global-loader');
                if(loader) { loader.style.opacity = '0'; setTimeout(() => loader.remove(), 400); }
            }, 600);

            if (DEV_MODE) {
                console.log("⚠️ DEVELOPER MODE: Bypassing Auth");
                currentUser = {
                    firstName: "Developer",
                    imageUrl: "https://ui-avatars.com/api/?name=Dev+Admin&background=2DD4BF&color=fff",
                    publicMetadata: { isPro: true }
                };
                updateUIForUser(currentUser);
                return;
            }

            try {
                await Clerk.load();
                clerkInstance = Clerk;
                if (Clerk.user) {
                    currentUser = Clerk.user;
                    updateUIForUser(Clerk.user);
                } else {
                    updateUIForGuest();
                }
            } catch (error) {
                console.error("Clerk Error");
                updateUIForGuest();
            }
        });

        // 2. UI UPDATERS
        function updateUIForUser(user) {
            const isPro = user.publicMetadata.isPro === true;
            const planName = isPro ? '<span class="text-brand-neon font-bold">PRO ACCOUNT</span>' : 'Free Plan';
            document.getElementById('userProfileArea').innerHTML = `
                <div class="flex items-center">
                    <img src="${user.imageUrl}" class="w-10 h-10 rounded-full border-2 border-brand-neon">
                    <div class="ml-3">
                        <p class="text-sm font-bold text-white">${user.firstName}</p>
                        <p class="text-xs text-gray-400">${planName}</p>
                    </div>
                </div>`;
            document.getElementById('authActionArea').innerHTML = `<button onclick="Clerk.signOut()" class="hidden md:flex items-center space-x-2 text-xs font-bold text-gray-300 hover:text-red-400 transition"><i class="fa-solid fa-right-from-bracket"></i><span>Sign Out</span></button>`;
        }

        function updateUIForGuest() {
            document.getElementById('authActionArea').innerHTML = `<button onclick="Clerk.openSignIn()" class="hidden md:flex items-center space-x-2 text-xs font-bold text-brand-neon hover:text-white transition animate-pulse"><i class="fa-solid fa-lock"></i><span>Login to Save</span></button>`;
        }

        // 3. SWITCH MODES
        function switchMode(btn, mode) {
            currentMode = mode;
            document.getElementById('currentModeTitle').innerText = mode;
            
            const std = document.getElementById('standardInputs');
            const cst = document.getElementById('customUIContainer');
            const out = document.getElementById('outputArea');
            const sub = document.getElementById('subInputContainer');
            const tog = document.getElementById('toggleGroup');
            const chart = document.getElementById('chartContainer');
            const sumBadge = document.getElementById('summaryBadge');
            
            std.classList.remove('hidden-view');
            cst.classList.add('hidden-view');
            sub.classList.remove('hidden-view');
            tog.classList.add('hidden-view');
            chart.classList.add('hidden-view');
            sumBadge.classList.add('hidden-view');
            out.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-center space-y-3 opacity-20"><i class="fa-solid fa-terminal text-2xl"></i><p class="text-[8px] font-black uppercase tracking-widest">Ready</p></div>`;
            document.getElementById('mainInput').value = "";
            
            if(window.innerWidth < 768) document.getElementById('mainAppArea').scrollIntoView({ behavior: 'smooth' });

            document.querySelectorAll('.sidebar-btn').forEach(b => b.className = 'sidebar-btn w-full flex items-center px-4 py-3 text-sm font-medium text-gray-400 hover:bg-gray-800 rounded-lg transition-all');
            btn.className = 'sidebar-btn w-full flex items-center px-4 py-3 text-sm font-bold text-brand-dark bg-brand-neon rounded-lg shadow-neon transition-all';

            // MODE CONFIG
            if (mode === "M-Pesa Auditor") {
                document.getElementById('label1').innerText = "PASTE SMS MESSAGES";
                document.getElementById('mainInput').placeholder = "Paste full M-Pesa SMS messages here...";
                sub.classList.add('hidden-view');
            } 
            else if (mode === "Cash Flow") {
                std.classList.add('hidden-view');
                cst.classList.remove('hidden-view');
                cst.innerHTML = `<div class="grid grid-cols-2 gap-4"><div><label class="text-xs font-bold text-gray-400 mb-2 block">Opening Balance</label><input type="number" id="cf-open" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-white font-mono" placeholder="0"></div><div><label class="text-xs font-bold text-green-500 mb-2 block">Sales Today</label><input type="number" id="cf-in" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-white font-mono" placeholder="0"></div><div class="col-span-2"><label class="text-xs font-bold text-red-500 mb-2 block">Total Expenses</label><input type="number" id="cf-out" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-white font-mono" placeholder="0"></div></div>`;
                chart.classList.remove('hidden-view');
            }
            // --- UPDATED INVOICE UI ---
            else if (mode === "Quick Invoice") {
                std.classList.add('hidden-view');
                cst.classList.remove('hidden-view');
                cst.innerHTML = `
                    <div class="space-y-4">
                        <input type="text" id="inv-biz" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-white font-bold" placeholder="Your Business Name">
                        
                        <div class="grid grid-cols-2 gap-2">
                             <select id="inv-pay-method" class="bg-gray-900 border border-gray-700 rounded-lg p-3 text-white text-sm focus:border-brand-neon outline-none">
                                <option value="M-Pesa Buy Goods">M-Pesa Buy Goods (Till)</option>
                                <option value="M-Pesa Paybill">M-Pesa Paybill</option>
                                <option value="Bank Transfer">Bank Transfer</option>
                             </select>
                             <input type="text" id="inv-pay-acc" class="bg-gray-900 border border-gray-700 rounded-lg p-3 text-brand-neon text-sm font-bold placeholder-gray-500" placeholder="Enter Number / Account">
                        </div>
                        
                        <input type="text" id="inv-phone" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white text-sm" placeholder="Your Contact Phone">
                        
                        <hr class="border-gray-700">
                        
                        <input type="text" id="inv-client" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-4 text-white" placeholder="Client Name">
                        
                        <div class="grid grid-cols-3 gap-2">
                            <input type="text" id="item1" class="col-span-2 bg-gray-900 border border-gray-700 rounded-lg p-3 text-white" placeholder="Item Description">
                            <input type="number" id="price1" class="bg-gray-900 border border-gray-700 rounded-lg p-3 text-white font-mono" placeholder="Price">
                        </div>
                    </div>
                `;
            }
            else if (mode === "Debt Collection" || mode === "SMS Templates") {
                document.getElementById('label1').innerText = "CLIENT INFO";
                document.getElementById('label2').innerText = "AMOUNT & DATE";
                tog.classList.remove('hidden-view');
            }
            else {
                document.getElementById('label1').innerText = "PRODUCT / SERVICE";
                document.getElementById('label2').innerText = "TARGET AUDIENCE / OFFER";
            }
        }

        function setTone(btn, tone) {
            activeTone = tone;
            document.querySelectorAll('.tone-btn').forEach(b => { b.classList.remove('bg-brand-neon', 'text-brand-dark', 'shadow'); b.classList.add('text-gray-400'); });
            btn.classList.remove('text-gray-400'); btn.classList.add('bg-brand-neon', 'text-brand-dark', 'shadow');
        }

        // 4. PROCESSOR LOGIC
        async function runProcessor() {
            const btn = document.getElementById('processBtn');
            const originalBtnText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> READING DATA...';
            btn.disabled = true;

            // Small delay to allow UI to update
            setTimeout(async () => {
                try {
                    // --- A. CLIENT-SIDE TOOLS (Calculators/Regex) ---
                    
                    if (currentMode === "M-Pesa Auditor") {
                        const text = document.getElementById('mainInput').value;
                        const regex = /([A-Z0-9]{10}).*?Confirmed.*?Ksh\s?([\d,]+\.?\d*).*?(?:sent to|paid to|received from|bought)\s+(.*?)\s+on\s+(\d{1,2}\/\d{1,2}\/\d{2,4})\s+at\s+(\d{1,2}:\d{2}\s?[AP]M)/gi;
                        let match, html = "", total = 0;
                        while ((match = regex.exec(text)) !== null) {
                            const amt = parseFloat(match[2].replace(/,/g, ''));
                            total += amt;
                            html += `<div class="p-3 border-b border-gray-800 flex justify-between items-center hover:bg-white/5 transition"><div><span class="text-brand-neon font-mono text-xs block">${match[1]}</span><span class="text-gray-400 text-[10px]">${match[4]} ${match[5]}</span></div><div class="text-right"><span class="text-white text-xs block font-bold">${match[3].substr(0,15)}..</span><span class="text-green-400 font-mono text-sm">KES ${amt.toLocaleString()}</span></div></div>`;
                        }
                        document.getElementById('outputArea').innerHTML = html || "<div class='text-center p-10 text-gray-500'>No valid M-Pesa messages found.</div>";
                        document.getElementById('totalIn').innerText = `TOTAL: KES ${total.toLocaleString()}`;
                        document.getElementById('summaryBadge').classList.remove('hidden-view');
                    } 
                    else if (currentMode === "Cash Flow") {
                        const open = parseFloat(document.getElementById('cf-open').value) || 0;
                        const income = parseFloat(document.getElementById('cf-in').value) || 0;
                        const exp = parseFloat(document.getElementById('cf-out').value) || 0;
                        const close = open + income - exp;
                        document.getElementById('outputArea').innerHTML = `<div class="h-full flex flex-col justify-center items-center"><p class="text-gray-500 uppercase text-[10px] font-bold tracking-widest mb-2">CLOSING BALANCE</p><h2 class="text-5xl font-black text-brand-neon my-2">KES ${close.toLocaleString()}</h2></div>`;
                        const ctx = document.getElementById('cashFlowChart');
                        if (window.myChart) window.myChart.destroy();
                        window.myChart = new Chart(ctx, {
                            type: 'bar',
                            data: { labels: ['In', 'Out', 'Net'], datasets: [{ label: 'KES', data: [income, exp, income-exp], backgroundColor: ['#4ade80', '#f87171', '#2DD4BF'] }] },
                            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                        });
                    }
                    else if (currentMode === "Quick Invoice") {
                        const biz = document.getElementById('inv-biz').value;
                        const client = document.getElementById('inv-client').value;
                        const item = document.getElementById('item1').value;
                        const price = document.getElementById('price1').value;
                        const payMethod = document.getElementById('inv-pay-method').value;
                        const payAcc = document.getElementById('inv-pay-acc').value;
                        
                        const now = new Date();
                        const dateStr = now.toLocaleDateString() + ' ' + now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        const invNum = `INV-${now.getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;

                        const vat = (price * 0.16).toFixed(2);
                        const total = (parseFloat(price) + parseFloat(vat)).toFixed(2);
                        
                        document.getElementById('outputArea').innerHTML = `
                            <div class="p-6 bg-white text-slate-800 rounded shadow-lg font-sans h-full overflow-y-auto relative">
                                <div class="flex justify-between items-start border-b-2 border-gray-800 pb-4 mb-4">
                                    <div><h2 class="text-xl font-black uppercase tracking-tight text-slate-900">${biz}</h2><p class="text-xs text-gray-500 mt-1">${invNum}</p></div>
                                    <div class="text-right"><p class="text-xs font-bold text-gray-500">DATE</p><p class="text-xs font-bold text-slate-900">${dateStr}</p></div>
                                </div>
                                <div class="mb-6"><p class="text-[10px] font-bold text-gray-400 uppercase mb-1">Bill To:</p><p class="text-lg font-bold text-slate-900">${client}</p></div>
                                <table class="w-full text-left text-sm mb-6">
                                    <thead class="bg-gray-100"><tr class="uppercase text-[10px] text-gray-600"><th class="p-2">Description</th><th class="p-2 text-right">Amount</th></tr></thead>
                                    <tbody><tr class="border-b border-gray-200"><td class="p-2 font-medium text-slate-900">${item}</td><td class="p-2 text-right text-slate-900">${parseInt(price).toLocaleString()}</td></tr></tbody>
                                </table>
                                <div class="flex justify-end mb-8"><div class="w-1/2 space-y-1 text-right text-slate-700"><div class="flex justify-between text-xs"><span>Subtotal:</span><span>${parseInt(price).toLocaleString()}</span></div><div class="flex justify-between text-xs"><span>VAT (16%):</span><span>${parseFloat(vat).toLocaleString()}</span></div><div class="flex justify-between text-lg font-black border-t-2 border-gray-800 pt-2 text-slate-900"><span>Total:</span><span>KES ${parseFloat(total).toLocaleString()}</span></div></div></div>
                                <div class="bg-slate-100 p-4 rounded border-l-4 border-slate-800">
                                    <p class="text-[10px] font-bold text-gray-500 uppercase mb-1">PAYMENT DETAILS</p>
                                    <div class="flex justify-between items-center">
                                        <span class="font-bold text-slate-900 text-sm">${payMethod}</span>
                                        <span class="font-black text-slate-900 text-lg bg-white px-2 py-1 rounded shadow-sm">${payAcc}</span>
                                    </div>
                                </div>
                                <div class="mt-4 text-center text-[9px] text-gray-400">Generated by SmartBizSystems</div>
                            </div>
                        `;
                    }

                    // --- B. AI TOOLS (Server-Side) ---
                    else {
                        btn.innerHTML = '<i class="fa-solid fa-brain fa-pulse mr-2"></i> GENERATING AI CONTENT...';
                        
                        const product = document.getElementById('mainInput').value;
                        const audience = document.getElementById('subInput').value || "General Audience";
                        const strategy = activeTone;

                        if (!product) {
                            alert("Please enter a product or topic first.");
                            throw new Error("Empty Input");
                        }

                        // Call the API
                        const response = await fetch('/api/generate', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ 
                                mode: currentMode,
                                product: product,
                                audience: audience,
                                strategy: strategy,
                                tone: activeTone
                            })
                        });

                        const data = await response.json();

                        if (!response.ok) {
                            throw new Error(data.message || "AI Error");
                        }

                        // Render AI Output
                        let outputHTML = '';
                        if (data.variationA) {
                            outputHTML += `
                                <div class="p-4 border-l-4 border-brand-neon bg-white/5 rounded-r-lg mb-6 hover:bg-white/10 transition">
                                    <div class="flex justify-between items-center mb-2">
                                        <p class="text-[10px] text-brand-neon uppercase font-black tracking-widest">OPTION A: ${currentMode === 'Viral Hooks' ? 'TikTok Style' : 'Primary'}</p>
                                        <button onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText)" class="text-xs text-gray-500 hover:text-white" title="Copy"><i class="fa-solid fa-copy"></i></button>
                                    </div>
                                    <p class="text-gray-200 leading-relaxed text-sm whitespace-pre-wrap font-sans">${data.variationA}</p>
                                </div>
                            `;
                        }
                        if (data.variationB) {
                            outputHTML += `
                                <div class="p-4 border-l-4 border-brand-purple bg-white/5 rounded-r-lg mb-4 hover:bg-white/10 transition">
                                    <div class="flex justify-between items-center mb-2">
                                        <p class="text-[10px] text-brand-purple uppercase font-black tracking-widest">OPTION B: ${currentMode === 'Viral Hooks' ? 'IG/FB Style' : 'Alternative'}</p>
                                        <button onclick="navigator.clipboard.writeText(this.parentElement.nextElementSibling.innerText)" class="text-xs text-gray-500 hover:text-white" title="Copy"><i class="fa-solid fa-copy"></i></button>
                                    </div>
                                    <p class="text-gray-200 leading-relaxed text-sm whitespace-pre-wrap font-sans">${data.variationB}</p>
                                </div>
                            `;
                        }
                        
                        document.getElementById('outputArea').innerHTML = outputHTML || "<div class='p-4 text-red-400'>No content returned.</div>";
                    }

                } catch (err) {
                    console.error(err);
                    if (err.message !== "Empty Input") {
                        document.getElementById('outputArea').innerHTML = `
                            <div class="h-full flex flex-col justify-center items-center text-center p-6">
                                <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-4"></i>
                                <p class="text-sm font-bold text-white mb-2">Generation Failed</p>
                                <p class="text-xs text-gray-400 max-w-xs">${err.message || "Check your internet connection or API Key."}</p>
                            </div>
                        `;
                    }
                } finally {
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                }
            }, 100); // Immediate execution after UI update
        }

        // 5. EXPORT (UPDATED PDF WITH PAYMENT INFO)
        function handleExport() {
            const content = document.getElementById('outputArea').innerText;
            if(!content || content.includes("Ready")) return alert("Nothing to export.");
            
            if(currentMode === "Quick Invoice") {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                const biz = document.getElementById('inv-biz').value || "Company";
                const phone = document.getElementById('inv-phone').value || "";
                const client = document.getElementById('inv-client').value || "Client";
                const item = document.getElementById('item1').value || "Service";
                const price = parseFloat(document.getElementById('price1').value) || 0;
                
                const payMethod = document.getElementById('inv-pay-method').value;
                const payAcc = document.getElementById('inv-pay-acc').value;
                
                const now = new Date();
                const dateStr = now.toLocaleDateString();
                const invNum = `INV-${now.getFullYear()}-${Math.floor(1000 + Math.random() * 9000)}`;
                const vat = price * 0.16;
                const total = price + vat;

                // PDF DESIGN
                doc.setFont("helvetica", "bold");
                doc.setFontSize(22);
                doc.text(biz, 15, 20); 
                
                doc.setFontSize(10);
                doc.setFont("helvetica", "normal");
                doc.text(phone, 15, 26);
                
                doc.setFontSize(16);
                doc.text("INVOICE", 150, 20);
                doc.setFontSize(10);
                doc.text(`Date: ${dateStr}`, 150, 26);
                doc.text(`No: ${invNum}`, 150, 31);

                doc.setLineWidth(0.5);
                doc.line(15, 36, 195, 36); 

                doc.text("BILL TO:", 15, 45);
                doc.setFont("helvetica", "bold");
                doc.text(client, 15, 51);

                // Table
                doc.setFillColor(240, 240, 240);
                doc.rect(15, 60, 180, 8, "F");
                doc.setFont("helvetica", "bold");
                doc.setFontSize(9);
                doc.text("DESCRIPTION", 18, 65);
                doc.text("AMOUNT (KES)", 160, 65);

                doc.setFont("helvetica", "normal");
                doc.text(item, 18, 75);
                doc.text(price.toLocaleString(), 160, 75);

                doc.line(15, 80, 195, 80);

                // Total
                doc.text("Subtotal:", 130, 90);
                doc.text(price.toLocaleString(), 160, 90);
                doc.text("VAT (16%):", 130, 96);
                doc.text(vat.toLocaleString(undefined, {minimumFractionDigits: 2}), 160, 96);

                doc.setFont("helvetica", "bold");
                doc.setFontSize(12);
                doc.text("TOTAL:", 130, 108);
                doc.text("KES " + total.toLocaleString(undefined, {minimumFractionDigits: 2}), 160, 108);

                // Payment Box
                doc.setDrawColor(0);
                doc.rect(15, 120, 180, 25);
                doc.setFontSize(10);
                doc.text("PAYMENT DETAILS", 20, 128);
                doc.setFont("helvetica", "normal");
                doc.text(`${payMethod}:`, 20, 136);
                doc.setFont("helvetica", "bold");
                doc.setFontSize(14);
                doc.text(payAcc, 60, 136);

                doc.setFontSize(8);
                doc.setFont("helvetica", "italic");
                doc.text("Thank you for your business!", 15, 155);

                doc.save(`Invoice_${invNum}.pdf`);
            } 
            else if (currentMode === "M-Pesa Auditor") {
                const ws = XLSX.utils.json_to_sheet(globalData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Transactions");
                XLSX.writeFile(wb, "SmartBiz_Audit.xlsx");
            }
            else {
                const content = document.getElementById('outputArea').innerText;
                const blob = new Blob([content], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = "SmartBiz_Output.txt";
                a.click();
            }
        }
        
        function payWithPaystack(user) {
             let handler = PaystackPop.setup({
                key: PAYSTACK_PUBLIC_KEY, 
                email: user.primaryEmailAddress.emailAddress,
                amount: 2500 * 100, 
                currency: 'KES',
                ref: ''+Math.floor((Math.random() * 1000000000) + 1),
                callback: function(response) {
                    alert('Payment successful!');
                    fetch('/api/upgrade-user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: user.id, reference: response.reference })
                    }).then(() => { window.location.reload(); });
                },
                onClose: function() { alert('Transaction cancelled.'); }
            });
            handler.openIframe();
        }
        
        function formatAIResponse(data) {
            if (typeof data === 'string') return data.replace(/\n/g, "<br>");
            if (typeof data === 'object' && data !== null) {
                return Object.values(data).map(val => String(val).replace(/\n/g, "<br>")).join('<br><br>');
            }
            return "No content generated.";
        }
    </script>


    <!-- COOKIE CONSENT BANNER -->
    <div id="cookie-banner" class="fixed bottom-0 left-0 w-full bg-[#0B0F19]/95 backdrop-blur-xl border-t border-gray-800 p-6 z-[100] transition-transform duration-500 transform translate-y-full">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="text-sm text-gray-300 text-center md:text-left"><p class="leading-relaxed"><i class="fa-solid fa-cookie-bite text-brand-neon mr-2"></i> We use cookies to ensure SmartBiz works securely. By continuing, you agree to our <a href="privacy.html" class="text-brand-neon underline hover:text-white">Privacy Policy</a>.</p></div>
            <div class="flex gap-4"><button onclick="declineCookies()" class="px-4 py-2 text-sm font-medium text-gray-400 hover:text-white border border-gray-700 rounded-lg transition-colors">Necessary Only</button><button onclick="acceptCookies()" class="px-6 py-2 text-sm font-bold text-brand-dark bg-brand-neon rounded-lg hover:bg-brand-neonhover shadow-neon transition-all transform hover:scale-105">Accept All</button></div>
        </div>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() { const banner = document.getElementById("cookie-banner"); if (!localStorage.getItem("smartbiz_cookie_consent")) { setTimeout(() => { banner.classList.remove("translate-y-full"); }, 2000); } });
        function acceptCookies() { const banner = document.getElementById("cookie-banner"); localStorage.setItem("smartbiz_cookie_consent", "accepted"); banner.classList.add("translate-y-full"); }
        function declineCookies() { const banner = document.getElementById("cookie-banner"); localStorage.setItem("smartbiz_cookie_consent", "declined"); banner.classList.add("translate-y-full"); }
    </script>
